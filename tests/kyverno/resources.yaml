apiVersion: v1
kind: Pod
metadata: { name: good, namespace: podinfo }
spec:
  securityContext: { runAsNonRoot: true }
  containers:
    - name: app
      image: ghcr.io/stefanprodan/podinfo:6.7.0
      resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
---
