apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-policies
policies:
  - ../../k8s/policies/disallow-privileged.yaml
  - ../../k8s/policies/require-limits.yaml
  - ../../k8s/policies/disallow-latest-tag.yaml
  - ../../k8s/policies/require-non-root.yaml
resources:
  - resources.yaml
results:
  - { policy: disallow-privileged, rule: no-privileged, resources: [good], kind: Pod, result: pass }
  - { policy: disallow-privileged, rule: no-privileged, resources: [privileged], kind: Pod, result: fail }
  - { policy: disallow-latest-tag, rule: require-pinned-tag, resources: [good], kind: Pod, result: pass }
  - { policy: disallow-latest-tag, rule: require-pinned-tag, resources: [latest], kind: Pod, result: fail }
  - { policy: require-requests-limits, rule: requests-and-limits, resources: [good], kind: Pod, result: pass }
  - { policy: require-requests-limits, rule: requests-and-limits, resources: [nolimits], kind: Pod, result: fail }
  - { policy: require-run-as-non-root, rule: run-as-non-root, resources: [good], kind: Pod, result: pass }
  - { policy: require-run-as-non-root, rule: run-as-non-root, resources: [root], kind: Pod, result: fail }
