name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kubeconform and kyverno CLI
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          curl -sSL https://github.com/kyverno/kyverno/releases/download/v1.12.5/kyverno-cli_v1.12.5_linux_x86_64.tar.gz | tar xz kyverno
      - name: schema-validate manifests
        run: ./kubeconform -strict -summary -ignore-missing-schemas k8s/apps k8s/loadtest.yaml
      - name: policy unit tests (each policy blocks its bad pod, allows the good one)
        run: ./kyverno test tests/kyverno
      - name: workloads comply with every policy
        run: ./kyverno apply k8s/policies --resource k8s/apps/podinfo/deployment.yaml --audit-warn=false
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - working-directory: infra
        run: terraform init -backend=false && terraform validate
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
