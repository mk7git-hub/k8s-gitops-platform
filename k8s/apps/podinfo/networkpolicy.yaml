# Default deny, then allow only HTTP into podinfo. k3s enforces NetworkPolicy out of the box.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: podinfo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http
  namespace: podinfo
spec:
  podSelector:
    matchLabels: { app: podinfo }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 9898, protocol: TCP }
