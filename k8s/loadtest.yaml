# kubectl apply -f k8s/loadtest.yaml, then watch: kubectl -n podinfo get hpa -w
apiVersion: batch/v1
kind: Job
metadata: { name: loadtest, namespace: podinfo }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: load
          image: busybox:1.36
          imagePullPolicy: Always
          command: ["sh", "-c", "end=$(($(date +%s)+180)); while [ $(date +%s) -lt $end ]; do for i in 1 2 3 4 5 6 7 8; do wget -q -O- http://podinfo/delay/0 >/dev/null & done; wait; done"]
          resources: { requests: { cpu: 100m, memory: 32Mi }, limits: { cpu: 500m, memory: 64Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
